[pytest]
testpaths = tests
pythonpath = src
addopts = --strict-markers
markers =
    unit: tes cepat yang tidak menyentuh Word/Pandoc/mmdc
    integration: tes yang membutuhkan Pandoc, Word, atau artefak build
    packaging: tes packaging repo-local atau wheel
    e2e: tes end-to-end yang dijalankan dari luar repo
    word: tes yang membutuhkan Microsoft Word
    windows: tes yang hanya berjalan di Windows
