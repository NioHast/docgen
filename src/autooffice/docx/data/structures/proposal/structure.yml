# Struktur proposal tesis UNDIP MSI.
# Memuat halaman persetujuan, TOC, empat bab body, dan bibliografi.
# Penomoran arab bertitik; cover tanpa dosen pembimbing dan logo 4,7 cm.
format: undip-msi

front_matter:
  - {id: cover, source: generated}
  - {id: approval, source: template, template: approval.md}
  - {id: toc, source: generated}

body:
  - {id: pendahuluan, title: "Pendahuluan"}
  - {id: tinjauan-pustaka, title: "Tinjauan Pustaka"}
  - {id: metode-penelitian, title: "Metode Penelitian"}
  - {id: jadwal-penelitian, title: "Jadwal Penelitian"}

back_matter:
  - {id: bibliography, source: generated}

toc: true

numbering:
  body: ARABIC_DOTTED
  sub_dot: true
  subsub_dot: true

lists:
  figures: false
  tables: false

# Kunci cover mengikuti kontrak DOCX di docs/contracts/docx.md.
cover:
  show_lecturer: false
  logo_width: 4.7cm
