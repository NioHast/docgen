# Struktur proposal tesis UNDIP MSI.
# Sumber urutan: structures/proposal.yml lama, ditambah halaman persetujuan
# sesuai docs/dev/proposal.md.
# Perbedaan dari tesis diambil dari presets/undip-msi-proposal.yml:
# - heading_chapter_prefix: "" + heading_chapter_num_format: arabic
# - cover_show_lecturer: false + cover_logo_width: 4.7cm
format: undip-msi

front_matter:
  - {id: cover, source: generated}
  - {id: approval, source: template, template: approval.md}
  - {id: toc, source: generated}

body:
  - {id: pendahuluan, title: "Pendahuluan"}
  - {id: tinjauan-pustaka, title: "Tinjauan Pustaka"}
  - {id: metode-penelitian, title: "Metode Penelitian"}
  - {id: jadwal-penelitian, title: "Jadwal Penelitian"}

back_matter:
  - {id: bibliography, source: generated}

toc: true

numbering:
  body: ARABIC_DOTTED
  sub_dot: true
  subsub_dot: true

lists:
  figures: false
  tables: false

# Override cover khusus proposal. Key ini belum ada di kontrak
# docs/dev/contracts/config.md bagian structure.yml; lihat laporan WS1.
cover:
  show_lecturer: false
  logo_width: 4.7cm
