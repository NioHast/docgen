# Format: Universitas Diponegoro - Magister Sistem Informasi (UNDIP MSI)
# Nilai format, identitas, CSL, dan bibliography untuk struktur UNDIP MSI.
# Nomor bab (prefix/format) tidak disimpan di sini karena berbeda per
# struktur; lihat structures/<id>/structure.yml bagian numbering.
# Skema mengikuti docs/dev/contracts/config.md.
format: undip-msi
name: "Universitas Diponegoro - Magister Sistem Informasi"
description: "Margin 4/3/4/3 cm, Times New Roman 12 pt, spasi 1,5, sitasi author-date UNDIP MSI."

page:
  # Ukuran/orientasi/jarak header-footer memakai nilai kontrak format.
  size: A4
  orientation: portrait
  # Margin halaman: atas 4 cm, bawah 3 cm, kiri 4 cm, kanan 3 cm.
  margins:
    top: 4cm
    bottom: 3cm
    left: 4cm
    right: 3cm
  header_distance: 1.27cm
  footer_distance: 1.27cm
  gutter: 0cm

font:
  body:
    # Teks normal: Times New Roman 12 pt, spasi 1,5.
    family: "Times New Roman"
    size: 12pt
    # 360 twip = 1,5 baris
    line_spacing: 1.5
    space_before: 0pt
    space_after: 0pt
    alignment: both
    first_line_indent: 1.25cm
  monospace:
    # Font kode sumber: Courier New 10 pt.
    family: "Courier New"
    size: 10pt

abstract:
  # Isi dan kata kunci abstrak: Times New Roman 10 pt, spasi 1,0.
  font: "Times New Roman"
  size: 10pt
  line_spacing: 1.0
  space_before: 0pt
  space_after: 0pt
  alignment: both

headings:
  styles:
    heading1:
      # Heading 1: rata tengah, Times New Roman 12 pt bold, spasi 1,5.
      font_family: "Times New Roman"
      font_size: 12pt
      bold: true
      color: "000000"
      alignment: center
      space_before: 0pt
      space_after: 0pt
      # 360 twip = 1,5 baris
      line_spacing: 1.5
      keep_next: true
      keep_lines: true
      outline_level: 0
      first_line_indent: 0cm
    heading2:
      # Heading 2: rata kiri-kanan, indentasi 1,25 cm, spasi 1,5.
      font_family: "Times New Roman"
      font_size: 12pt
      bold: true
      color: "000000"
      alignment: both
      space_before: 0pt
      space_after: 0pt
      # 360 twip = 1,5 baris
      line_spacing: 1.5
      keep_next: true
      keep_lines: true
      outline_level: 1
      indent_left: 1.25cm
      indent_hanging: 1.25cm
    heading3:
      # Heading 3: rata kiri-kanan, indentasi 1,25 cm, spasi 1,5.
      font_family: "Times New Roman"
      font_size: 12pt
      bold: true
      color: "000000"
      alignment: both
      space_before: 0pt
      space_after: 0pt
      # 360 twip = 1,5 baris
      line_spacing: 1.5
      keep_next: true
      keep_lines: true
      outline_level: 2
      indent_left: 1.25cm
      indent_hanging: 1.25cm

# Gaya judul daftar isi. Toggle daftar isi ada di structure.yml (`toc`),
# bukan di sini.
toc_heading:
  heading_style: "TOCHeading"
  # Font judul daftar isi: Times New Roman 12 pt.
  font: "Times New Roman"
  size: 12pt
  bold: true
  color: "000000"
  alignment: center
  space_before: 0pt
  space_after: 0pt
  # 360 twip = 1,5 baris
  line_spacing: 1.5
  first_line_indent: 0cm

captions:
  figure:
    # Caption gambar: Times New Roman 10 pt, spasi 1,0.
    font:
      family: "Times New Roman"
      size: 10pt
      bold: false
      italic: false
      space_before: 0pt
      space_after: 0pt
      # 240 twip = 1,0 baris
      line_spacing: 1.0
  table:
    # Caption tabel: Times New Roman 10 pt, rata kiri, spasi 1,0.
    keep_next: true
    font:
      family: "Times New Roman"
      size: 10pt
      bold: false
      italic: false
      alignment: left
      space_before: 0pt
      space_after: 0pt
      # 240 twip = 1,0 baris
      line_spacing: 1.0

# Perataan caption gambar dan counter caption gambar/tabel.
figures:
  # Perataan caption dan gambar: rata tengah.
  caption_alignment: center
  image_alignment: center
  numbering: chapter
  space_before: 0pt
  space_after: 0pt
  first_line_indent: 0cm

code:
  # Blok kode sumber: Courier New 10 pt, border tunggal, cell margin 108 twip.
  font:
    family: "Courier New"
    size: 10pt
  # 240 twip = 1,0 baris
  line_spacing: 1.0
  space_before: 0pt
  space_after: 0pt
  shading: none
  # Perataan kode sumber: rata kiri.
  alignment: left
  border:
    style: single
    width: 1pt
    color: "000000"
  table:
    width: 100%
    cell_margin: 108twip

# Gaya daftar pustaka. Path file .bib ada di citation.bibliography.
bibliography_style:
  heading: "DAFTAR PUSTAKA"
  # Font daftar pustaka: Times New Roman 12 pt, spasi 1,5.
  font: "Times New Roman"
  size: 12pt
  # 360 twip = 1,5 baris
  line_spacing: 1.5
  space_before: 0pt
  space_after: 0pt
  indent_left: 1.27cm
  indent_hanging: 1.27cm

citation:
  csl: citation.csl
  # Berkas bibliography relatif terhadap format ini.
  bibliography: references.bib

# Ukuran dan visibilitas cover ada di structure.cover, bukan di sini.
assets:
  logo: logo.jpg
  reference_docx: reference.docx
