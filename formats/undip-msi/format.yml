# Format: Universitas Diponegoro — Magister Sistem Informasi (UNDIP MSI)
# Lapis format hanya mengatur rupa dan perkakas sitasi. Urutan bab milik
# structures/, sedangkan naskah milik content/.
format: undip-msi
name: "Universitas Diponegoro - Magister Sistem Informasi"
description: "Margin 4-4-3-3 cm, Times New Roman 12 pt, spasi 1,5, sitasi author-date UNDIP MSI."
csl: "refs/undip-msi.csl"
bibliography: "references.bib"

# Pemetaan struktur -> preset lama di presets/. Pipeline build-docx.sh tetap
# membaca kunci `preset:` dari metadata.yml; pemetaan ini dipakai saat `new`.
presets:
  default: "undip-skripsi"
  thesis: "undip-skripsi"
  proposal: "undip-msi-proposal"
  assignment: "undip-msi-proposal"
