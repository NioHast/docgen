[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docgen"
version = "0.1.0"
description = "Design system dan pipeline laporan akademik berbasis Markdown."
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "python-docx==1.2.0",
    "lxml==6.1.3",
    "ruamel.yaml==0.19.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pypdf==7.0.0",
    "Pillow==13.0.0",
]

[project.scripts]
docgen = "docgen.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docgen = ["data/**/*"]
