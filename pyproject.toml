[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docgen"
version = "0.1.0"
description = "Design system dan pipeline laporan akademik berbasis Markdown."
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "lxml==6.1.3",
    "ruamel.yaml==0.19.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pypdf==7.0.0",
    "python-docx==1.2.0",
    "mypy==2.4.1",
    "ruff==0.17.4",
    "pytest-cov==7.1.0",
    "import-linter==2.16",
]

[project.scripts]
docgen = "docgen.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docgen = ["data/**/*"]

[tool.ruff]
# 100 kolom: cukup untuk ekspresi dan pesan error, tetap nyaman dibaca.
line-length = 100
# Target Python 3.15 agar UP dan RUF memakai sintaks modern.
target-version = "py315"
# Docs memuat snippet Python ilustratif di code fence, bukan kode yang dijalankan.
extend-exclude = ["docs"]
# Referensi konfigurasi: https://docs.astral.sh/ruff/configuration/

[tool.ruff.lint]
# Setiap kelompok dipilih karena menangkap kelas bug yang relevan.
# Daftar aturan: https://docs.astral.sh/ruff/rules/
select = [
  "E",   # pycodestyle error: spasi, indentasi, baris.
  "F",   # pyflakes: nama tidak terdefinisi dan import mati.
  "W",   # pycodestyle warning: trailing whitespace dan sejenisnya.
  "I",   # isort: urutan dan pengelompokan import.
  "UP",  # pyupgrade: sintaks lama yang sudah digantikan Python 3.15.
  "B",   # bugbear: pola rawan bug seperti mutable default.
  "SIM", # simplify: kontrol alur yang bisa disederhanakan.
  "RUF", # aturan khusus Ruff: konsistensi dan potensi bug.
  "BLE", # blind except: except terlalu luas tanpa alasan.
  # flake8-pytest-style: assertion dan raises yang spesifik, sesuai docs/dev/test-quality.md.
  "PT010", # raises tanpa exception type.
  "PT011", # raises terlalu luas tanpa match.
  "PT012", # blok raises berisi lebih dari satu statement.
  "PT014", # parametrize duplikat.
  "PT018", # assertion gabungan.
  "PT019", # fixture dipakai tanpa parameter.
  "PT027", # pytest.raises dengan alias unittest.
  "PT028", # parameter test dengan default.
  "D",   # pydocstyle: kualitas docstring, dengan pengecualian di bawah.
]

# Pengecualian ini menjaga refactor tetap kecil dan tidak memaksa churn.
ignore = [
  "D101", # Docstring class publik ditunda; D8 menargetkan modul kunci.
  "D102", # Docstring method publik ditunda; kontrak ada di docs.
  "D103", # Docstring fungsi publik ditunda; D8 menargetkan fungsi panjang.
  "D105", # Docstring magic method tidak menambah informasi.
  "D107", # Docstring __init__ tidak perlu jika class sudah jelas.
  "D202", # Baris kosong setelah docstring tidak dipakai konsisten.
  "D401", # Imperative mood Inggris sulit diterapkan pada docstring Indonesia.
]

[tool.ruff.lint.per-file-ignores]
# `O` adalah prefix namespace OOXML resmi di tabel Clark notation, bukan variabel lokal.
"src/docgen/docx/names.py" = ["E741"]

[tool.mypy]
# Non-strict dulu: target Fase 1 adalah baseline yang bersih, bukan strict total.
python_version = "3.15"
files = ["src/docgen"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Stub pihak ketiga belum lengkap; longgarkan dulu, ketatkan per modul.
ignore_missing_imports = true

[tool.importlinter]
# Kontrak import dicek dari paket yang terpasang (editable) di src/docgen.
root_packages = ["docgen"]

[[tool.importlinter.contracts]]
name = "docx tidak boleh mengimpor stage, pipeline, CLI, atau adeu"
type = "forbidden"
source_modules = ["docgen.docx"]
forbidden_modules = [
    "docgen.stages",
    "docgen.pipeline",
    "docgen.cli",
    "docgen.adeu",
]

[[tool.importlinter.contracts]]
name = "config tidak boleh mengimpor docx, stage, pipeline, CLI, adeu, atau markdown"
type = "forbidden"
source_modules = ["docgen.config"]
forbidden_modules = [
    "docgen.docx",
    "docgen.stages",
    "docgen.pipeline",
    "docgen.cli",
    "docgen.adeu",
    "docgen.markdown",
]

[[tool.importlinter.contracts]]
name = "markdown tidak boleh mengimpor docx, stage, pipeline, CLI, atau adeu"
type = "forbidden"
source_modules = ["docgen.markdown"]
forbidden_modules = [
    "docgen.docx",
    "docgen.stages",
    "docgen.pipeline",
    "docgen.cli",
    "docgen.adeu",
]

[[tool.importlinter.contracts]]
name = "adeu tidak boleh mengimpor stage, pipeline, atau CLI"
type = "forbidden"
source_modules = ["docgen.adeu"]
forbidden_modules = [
    "docgen.stages",
    "docgen.pipeline",
    "docgen.cli",
]

[[tool.importlinter.contracts]]
name = "stage tidak boleh mengimpor CLI"
type = "forbidden"
source_modules = ["docgen.stages"]
forbidden_modules = ["docgen.cli"]
