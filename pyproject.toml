[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autooffice"
version = "0.1.0"
description = "Pipeline dokumen dan presentasi AutoOffice dari Markdown dan YAML."
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "lxml==6.1.3",
    "python-pptx==1.0.2",
    "ruamel.yaml==0.19.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pypdf==7.0.0",
    "python-docx==1.2.0",
    "mypy==2.4.1",
    "ruff==0.17.4",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.15",
    "import-linter==2.16",
    "cosmic-ray==8.9.0",
]
google = [
    "google-api-python-client==2.202.0",
    "google-auth-oauthlib==1.5.0",
]
windows = [
    'pywin32==312; sys_platform == "win32"',
]

[project.scripts]
autooffice = "autooffice.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["autooffice*"]

[tool.setuptools.package-data]
autooffice = [
    "assets/**/*",
    "design/data/**/*",
    "docx/data/**/*",
]

[tool.ruff]
# 100 kolom: cukup untuk ekspresi dan pesan error, tetap nyaman dibaca.
line-length = 100
# Target Python 3.15 agar UP dan RUF memakai sintaks modern.
target-version = "py315"
# Docs memuat snippet Python ilustratif di code fence, bukan kode yang dijalankan.
extend-exclude = ["docs"]
# Referensi konfigurasi: https://docs.astral.sh/ruff/configuration/

[tool.ruff.lint]
# Setiap kelompok dipilih karena menangkap kelas bug yang relevan.
# Daftar aturan: https://docs.astral.sh/ruff/rules/
select = [
  "E",   # pycodestyle error: spasi, indentasi, baris.
  "F",   # pyflakes: nama tidak terdefinisi dan import mati.
  "W",   # pycodestyle warning: trailing whitespace dan sejenisnya.
  "I",   # isort: urutan dan pengelompokan import.
  "UP",  # pyupgrade: sintaks lama yang sudah digantikan Python 3.15.
  "B",   # bugbear: pola rawan bug seperti mutable default.
  "SIM", # simplify: kontrol alur yang bisa disederhanakan.
  "RUF", # aturan khusus Ruff: konsistensi dan potensi bug.
  "BLE", # blind except: except terlalu luas tanpa alasan.
  # flake8-pytest-style: assertion dan raises yang spesifik, sesuai docs/dev/test-quality.md.
  "PT010", # raises tanpa exception type.
  "PT011", # raises terlalu luas tanpa match.
  "PT012", # blok raises berisi lebih dari satu statement.
  "PT014", # parametrize duplikat.
  "PT018", # assertion gabungan.
  "PT019", # fixture dipakai tanpa parameter.
  "PT027", # pytest.raises dengan alias unittest.
  "PT028", # parameter test dengan default.
  "D",   # pydocstyle: kualitas docstring, dengan pengecualian di bawah.
]

# Pengecualian ini menjaga refactor tetap kecil dan tidak memaksa churn.
ignore = [
  "D101", # Docstring class publik ditunda; D8 menargetkan modul kunci.
  "D102", # Docstring method publik ditunda; kontrak ada di docs.
  "D103", # Docstring fungsi publik ditunda; D8 menargetkan fungsi panjang.
  "D105", # Docstring magic method tidak menambah informasi.
  "D107", # Docstring __init__ tidak perlu jika class sudah jelas.
  "D202", # Baris kosong setelah docstring tidak dipakai konsisten.
  "D401", # Imperative mood Inggris sulit diterapkan pada docstring Indonesia.
]

[tool.mypy]
# Non-strict dulu: target Fase 1 adalah baseline yang bersih, bukan strict total.
python_version = "3.15"
files = ["src/autooffice"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Stub pihak ketiga belum lengkap; longgarkan dulu, ketatkan per modul.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["autooffice.*"]
strict = true
ignore_missing_imports = false
warn_unreachable = true

[tool.importlinter]
# Kontrak import dicek dari paket yang terpasang (editable) di src.
root_packages = ["autooffice"]

[[tool.importlinter.contracts]]
name = "autooffice.design tidak boleh mengimpor domain deck, docx, google, pdf, atau CLI"
type = "forbidden"
source_modules = ["autooffice.design"]
forbidden_modules = [
    "autooffice.deck",
    "autooffice.docx",
    "autooffice.google",
    "autooffice.pdf",
    "autooffice.cli",
]

[[tool.importlinter.contracts]]
name = "autooffice.common tidak boleh mengimpor domain deck, docx, google, pdf, atau CLI"
